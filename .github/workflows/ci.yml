name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install core dependencies
        run: |
          pip install pydantic pydantic-settings groq python-dotenv
      
      - name: Verify settings load
        run: |
          python -c "from backend.config.settings import settings; print('Settings loaded:', settings.EMOTION_MODEL)"
      
      - name: Verify imports work
        run: |
          python -c "from backend.models.llm_responder import LLMResponder; print('LLM Responder imports OK')"
        env:
          GROQ_API_KEY: "gsk_dummy_for_import_test"
      
      - name: Success
        run: echo "✅ Smoke tests passed - core modules load correctly"